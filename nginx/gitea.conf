server {
    listen 80;
    server_name _;

    location / {
        # 0 = unlimited (LAN / local disk; Gitea app.ini still has soft caps)
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://gitea:3000;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;
        # $host strips port; Gitea 1.27+ CrossOriginProtection compares Origin host:port to Host.
        # Plain HTTP to LAN IP has no Sec-Fetch-Site, so port must be preserved via $http_host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
