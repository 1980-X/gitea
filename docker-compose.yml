# Gitea 托管栈（配置就绪 ≠ 已部署；部署须显式指令）
# 官方镜像 + 专用 nginx 唯一宿主机入口；gitea / postgres 只 expose
services:
  gitea-nginx:
    image: nginx:1.27-alpine
    container_name: gitea-nginx
    restart: unless-stopped
    ports:
      - "${GITEA_HTTP_PORT:-18600}:80"
    volumes:
      - ./nginx/gitea.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gitea
    networks:
      - gitea_net

  gitea:
    image: docker.gitea.com/gitea:1.27.2
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${POSTGRES_DB:-gitea}
      GITEA__database__USER: ${POSTGRES_USER:-gitea}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GITEA__server__DOMAIN: ${GITEA__server__DOMAIN:?set GITEA__server__DOMAIN in .env}
      GITEA__server__ROOT_URL: ${GITEA__server__ROOT_URL:?set GITEA__server__ROOT_URL in .env}
      GITEA__server__HTTP_PORT: ${GITEA__server__HTTP_PORT:-3000}
      GITEA__server__DISABLE_SSH: ${GITEA__server__DISABLE_SSH:-false}
      GITEA__server__SSH_PORT: ${GITEA__server__SSH_PORT:-18622}
      GITEA__server__SSH_LISTEN_PORT: "22"
      # LAN：放宽 Web 上传 / 附件 / Release（MB）。变量名勿含「.」，否则 compose 插值失败。
      GITEA__server__LFS_MAX_FILE_SIZE: ${GITEA_LFS_MAX_FILE_SIZE:-0}
      GITEA__repository.upload__FILE_MAX_SIZE: ${GITEA_UPLOAD_FILE_MAX_SIZE:-102400}
      GITEA__repository.upload__MAX_FILES: ${GITEA_UPLOAD_MAX_FILES:-500}
      GITEA__attachment__MAX_SIZE: ${GITEA_ATTACHMENT_MAX_SIZE:-102400}
      GITEA__attachment__MAX_FILES: ${GITEA_ATTACHMENT_MAX_FILES:-500}
      GITEA__attachment__ALLOWED_TYPES: ${GITEA_ATTACHMENT_ALLOWED_TYPES:-*/*}
      GITEA__repository.release__FILE_MAX_SIZE: ${GITEA_RELEASE_FILE_MAX_SIZE:-102400}
      GITEA__repository.release__MAX_FILES: ${GITEA_RELEASE_MAX_FILES:-100}
      GITEA__packages__LIMIT_TOTAL_OWNER_SIZE: ${GITEA_PACKAGES_LIMIT_TOTAL_OWNER_SIZE:--1}
      GITEA__packages__LIMIT_TOTAL_OWNER_COUNT: ${GITEA_PACKAGES_LIMIT_TOTAL_OWNER_COUNT:--1}
    ports:
      - "${GITEA_SSH_PORT:-18622}:22"
    expose:
      - "3000"
    volumes:
      - /mnt/storage/gitea/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      gitea-db:
        condition: service_healthy
    networks:
      - gitea_net

  gitea-db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gitea}
    expose:
      - "5432"
    volumes:
      - /mnt/storage/gitea/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gitea_net

networks:
  gitea_net:
    name: gitea_net
